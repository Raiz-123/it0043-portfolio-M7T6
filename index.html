<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
    
    <script src="js/storage.js"></script>
    <script src="js/theme-init.js"></script>

    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="#home">My Portfolio</a>

        <button id="theme-toggle" type="button" aria-pressed="false">
            Enable dark mode
        </button>

        <button
            id="nav-toggle"
            type="button"
            aria-controls="primary-nav"
            aria-expanded="false"
            aria-label="Open navigation menu">
            ☰
        </button>

        <nav id="primary-nav" aria-label="Main navigation" hidden>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h1>Welcome to My Portfolio</h1>
            <p>I am a Multimedia Arts student learning design and development.</p>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>This section will introduce me and my creative interests.</p>

            <div class="visitor-welcome">
                <p id="last-visit"></p>

                <label for="visitor-name">Your name:</label>
                <input
                    id="visitor-name"
                    type="text"
                    placeholder="Enter your name">

                <button id="save-visitor-name" type="button">
                    Save Name
                </button>
            </div>
        </section>
        <section id="projects">
            <h2>My Projects</h2>
            <div id="project-list" class="project-grid" aria-live="polite"></div>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>

            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        id="name"
                        name="name"
                        type="text"
                        required
                        aria-describedby="name-error">
                    <p id="name-error" class="field-error" aria-live="polite"></p>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        required
                        aria-describedby="email-error">
                    <p id="email-error" class="field-error" aria-live="polite"></p>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required
                        aria-describedby="message-error"></textarea>
                    <p id="message-error" class="field-error" aria-live="polite"></p>
                </div>

                <button type="submit">Send Message</button>
                <p id="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>
</body>
</html>
